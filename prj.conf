# ESP32S3 support
CONFIG_HEAP_MEM_POOL_SIZE=65000
CONFIG_PINCTRL=y

# Peripherals
CONFIG_GPIO=y
CONFIG_LED_STRIP=y
CONFIG_LED=y

# Shell
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SHELL=y
CONFIG_LED_SHELL=y
CONFIG_GPIO_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SPI_SHELL=y
CONFIG_HWINFO_SHELL=y
CONFIG_DEVICE_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y

# Logging
CONFIG_LOG=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=n
CONFIG_I2C_LOG_LEVEL_DBG=n
CONFIG_ETHERNET_LOG_LEVEL_DBG=n
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y

# Network

CONFIG_SPI=y

CONFIG_NETWORKING=y

CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_ETH_W5500=y

CONFIG_NET_SHELL=y

CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_MQTT_LIB=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0

CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.2.133"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.2.1"
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y

CONFIG_NET_DHCPV4=n

CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"

# Wifi
CONFIG_WIFI=y
CONFIG_INIT_STACKS=y
CONFIG_NET_L2_WIFI_MGMT=y

# SD Card
CONFIG_SDHC_ESP32=y
CONFIG_DISK_ACCESS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y

CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=4096

# Relays & RTC
CONFIG_I2C=y
CONFIG_I2C_ESP32=y
CONFIG_GPIO_PCA953X=y

# RTC
CONFIG_RTC=y
CONFIG_RTC_PCF85063A=y

# modbus

CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_CLIENT=y
CONFIG_MODBUS_SERIAL=y
CONFIG_MODBUS_LOG_LEVEL_DBG=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

# dmx-z shared driver (TX only)
CONFIG_DMX_Z=y
CONFIG_DMX_TX=y
CONFIG_DMX_RX=n

# Configuration

CONFIG_JSON_LIBRARY=y

# DMX512 on UART1 / RS485 (driver in drivers/dmx/)
CONFIG_UART_LINE_CTRL=y
CONFIG_ZBUS=y
CONFIG_MAIN_STACK_SIZE=4096

# Buzzer subsystem (passive piezo via LEDC PWM)
CONFIG_PWM=y
CONFIG_BUZZER=y
CONFIG_BUZZER_PWM=y

# Disable WiFi — only Ethernet is used
CONFIG_WIFI=n
CONFIG_NET_L2_WIFI_SHELL=n
CONFIG_NET_L2_WIFI_MGMT=n
