# ESP32S3 support
CONFIG_HEAP_MEM_POOL_SIZE=1024

CONFIG_PINCTRL=y

# Peripherals
CONFIG_GPIO=y
CONFIG_LED_STRIP=y
CONFIG_LED=y

# Shell
CONFIG_SHELL=y
CONFIG_LED_SHELL=y
CONFIG_GPIO_SHELL=y

# Logging
CONFIG_LOG=y
CONFIG_DISPLAY_LOG_LEVEL_DBG=n
CONFIG_I2C_LOG_LEVEL_DBG=n
CONFIG_ETHERNET_LOG_LEVEL_DBG=n
CONFIG_LED_STRIP_LOG_LEVEL_DBG=y

# Network
CONFIG_NETWORKING=y
CONFIG_ETH_DRIVER=y
CONFIG_SPI=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_SHELL=y

CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_INIT_TIMEOUT=0
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.2.162"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_AUTO_INIT=y
CONFIG_NET_CONFIG_NEED_IPV4=y